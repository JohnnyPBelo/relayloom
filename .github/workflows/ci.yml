name: RelayLoom checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-node:
    timeout-minutes: 15
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Run35888318827 exhausted the cumulative Windows job budget after
        # case522. Keep every test and the15m limit; run disjoint root suites.
        suite: [foundation, sites]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Build the Go peer required by controller and runtime-selection tests
        run: npm run native:build
      - run: node scripts/test-node-partition.mjs ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.suite }}
          path: |
            docs/evidence
            test-results
            .cache/fixture-http-failures/*.json
            .cache/web-invitation
          retention-days: 7

  node-ui:
    needs: native-node
    runs-on: ubuntu-latest
    # Run35753597485 passed 505 Node and 34 UI tests, then exceeded the
    # cumulative 15m job budget. Keep both gates, sequentially bounded.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run native:build
      - name: Inspect runner-provided Chrome
        run: google-chrome --version
      - run: npm run test:e2e
        env:
          RELAYLOOM_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-ui-evidence
          path: |
            docs/evidence
            test-results
            .cache/fixture-http-failures/*.json
            .cache/web-invitation
          retention-days: 7

  native-go:
    needs: node-ui
    runs-on: ubuntu-latest
    # Keep the full race and C storage gates. Run35413693543 passed these,
    # then hit the cumulative 25m job limit during interoperability.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run native:build
      - run: npm run test:native
      - name: C SQLite storage contract on the host (not Android execution)
        run: npm run test:native:cgo-storage

  native-interop:
    needs: native-go
    runs-on: ubuntu-latest
    # Sequential, separately bounded: no test/race deadline or coverage removed.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run native:build
      - run: npm run test:interop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-go-evidence
          path: |
            .cache/native-mixed/*.json
            .cache/native-interop/*/report.json
            .cache/fixture-http-failures/*.json
            .cache/web-invitation
          retention-days: 7

  native-ui:
    needs: native-interop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run native:build
      - name: Real UI against the native Go application
        run: node scripts/e2e.mjs --output=.cache/native-ui-e2e
        env:
          RELAYLOOM_TEST_BACKEND: native
          RELAYLOOM_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-evidence
          path: |
            .cache/native-ui-e2e
            .cache/fixture-http-failures/*.json
            .cache/web-invitation
            test-results/e2e.json
          retention-days: 7

  reticulum-reference:
    needs: native-ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci --ignore-scripts
      - name: Install hash-pinned reference RNS in project venv
        run: python3 scripts/reticulum-setup.py
      - name: Actual RNS processes and heterogeneous transport controls (PTY is not radio)
        run: npm run verify:reticulum
        env:
          RELAYLOOM_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reticulum-reference-evidence
          path: |
            .cache/reticulum-verification
            .cache/reticulum-web
            .cache/reticulum-web-rtc
            docs/evidence/reticulum/ui
            docs/evidence/reticulum/heterogeneous-node.json
            docs/evidence/reticulum/heterogeneous-native.json
            docs/evidence/reticulum/authorization.json
          retention-days: 7

  autonomous-browser:
    needs: reticulum-reference
    runs-on: ubuntu-latest
    # Run35794083324 passed 151/152 before the cumulative 15m deadline.
    # Preserve all tests and per-case limits; run two disjoint shards sequentially.
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - run: npm ci --ignore-scripts
      - name: Prove both browser shards cover the full discovered suite exactly once
        run: node scripts/verify-browser-shards.mjs
        env:
          RELAYLOOM_BROWSER_CHANNEL: chrome
      - name: Autonomous browser application, offline storage and actual WebRTC/WS peers
        run: |
          npm run build
          npm run native:build
          node scripts/e2e.mjs --config tests/browser/browser.config.ts --shard=${{ matrix.shard }}/2
        env:
          RELAYLOOM_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomous-browser-evidence-${{ matrix.shard }}
          path: |
            .cache/browser-shards/*.json
            .cache/browser-foundation/crypto-scope.json
            .cache/browser-foundation/rtc-scope.json
            .cache/browser-foundation/playwright.json
            .cache/browser-routing/mesh.json
            .cache/browser-routing/scheduling.json
            .cache/browser-routing/native-packet.json
            .cache/browser-routing/scheduling-failure.json
            .cache/browser-application/ui
            .cache/browser-native/*-network*
            .cache/browser-groups/*.json
            .cache/browser-reload-diagnostics
            test-results/**/test-failed-*.png
          retention-days: 7

  desktop-package:
    needs: native-ui
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
          - os: macos-latest
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Install project Electron runtime
        run: node node_modules/electron/install.js
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      - run: npm run build
      - run: npm run desktop:build
      - run: npm run desktop:package -- --${{ matrix.target }} --${{ matrix.arch }} --dir
      - name: Actual sandboxed Linux desktop and packaged execution
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a npm run desktop:smoke
          xvfb-run -a npm run desktop:packaged-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}-evidence
          path: |
            .cache/desktop/smoke.json
            .cache/desktop/smoke.png
            .cache/desktop/packaged-smoke.json
          retention-days: 7

  ios-simulator-build:
    needs: native-ui
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Actual Swift host policy tests
        run: node scripts/ios-build.mjs --policy-test
      - name: Host simulator runner and real Node peer contracts (not iOS execution)
        run: node --test apps/ios/Tests/SimulatorRunnerTests.mjs
      - name: Unsigned iOS simulator app and native framework build
        run: node scripts/ios-build.mjs --simulator
      - name: Execute native iOS UI and real Node peer on one installed simulator
        # Bounded compatibility probe after addmedia stalled on installed26.5.
        # Keep the full photo/XCTest gate; missing26.4.1 is a failure, not fallback.
        run: node scripts/ios-simulator.mjs --runtime=26.4.1
      - name: Clean only the simulator recorded by this gate
        if: always()
        run: node scripts/ios-simulator.mjs --cleanup-owned
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-execution-evidence
          path: .cache/ios/simulator/evidence
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-evidence
          path: |
            .cache/ios/*-report.json
            .cache/ios/logs
          retention-days: 7
