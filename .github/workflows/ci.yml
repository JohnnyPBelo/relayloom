name: RelayLoom checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-node:
    timeout-minutes: 15
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Inspect runner-provided Chrome
        if: runner.os == 'Linux'
        run: google-chrome --version
      - run: npm run test:e2e
        if: runner.os == 'Linux'
        env:
          RELAYLOOM_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: |
            docs/evidence
            test-results
            .cache/fixture-http-failures/*.json
            .cache/web-invitation
          retention-days: 7

  native-go:
    needs: native-node
    runs-on: ubuntu-latest
    # Run34750795247 completed its checks but hit15m during final teardown.
    # Keep the full serial test/interop/UI gate and bounded cleanup headroom.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run native:build
      - run: npm run test:native
      - name: C SQLite storage contract on the host (not Android execution)
        run: npm run test:native:cgo-storage
      - run: npm run test:interop
      - name: Real UI against the native Go application
        run: node scripts/e2e.mjs --output=.cache/native-ui-e2e
        env:
          RELAYLOOM_TEST_BACKEND: native
          RELAYLOOM_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-go-evidence
          path: |
            .cache/native-mixed/*.json
            .cache/native-interop/*/report.json
            .cache/native-ui-e2e
            .cache/fixture-http-failures/*.json
            .cache/web-invitation
          retention-days: 7

  reticulum-reference:
    needs: native-go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci --ignore-scripts
      - name: Install hash-pinned reference RNS in project venv
        run: python3 scripts/reticulum-setup.py
      - name: Actual RNS processes and heterogeneous transport controls (PTY is not radio)
        run: npm run verify:reticulum
        env:
          RELAYLOOM_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reticulum-reference-evidence
          path: |
            .cache/reticulum-verification
            .cache/reticulum-web
            .cache/reticulum-web-rtc
            docs/evidence/reticulum/ui
            docs/evidence/reticulum/heterogeneous-node.json
            docs/evidence/reticulum/heterogeneous-native.json
            docs/evidence/reticulum/authorization.json
          retention-days: 7

  autonomous-browser:
    needs: reticulum-reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - run: npm ci --ignore-scripts
      - name: Autonomous browser application, offline storage and actual WebRTC/WS peers
        run: npm run test:browser
        env:
          RELAYLOOM_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomous-browser-evidence
          path: |
            .cache/browser-foundation/crypto-scope.json
            .cache/browser-foundation/rtc-scope.json
            .cache/browser-foundation/playwright.json
            .cache/browser-routing/mesh.json
            .cache/browser-routing/scheduling.json
            .cache/browser-routing/native-packet.json
            .cache/browser-routing/scheduling-failure.json
            .cache/browser-application/ui
            .cache/browser-native/*-network*
            .cache/browser-groups/*.json
          retention-days: 7

  desktop-package:
    needs: native-go
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
          - os: macos-latest
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Install project Electron runtime
        run: node node_modules/electron/install.js
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      - run: npm run build
      - run: npm run desktop:build
      - run: npm run desktop:package -- --${{ matrix.target }} --${{ matrix.arch }} --dir
      - name: Actual sandboxed Linux desktop and packaged execution
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a npm run desktop:smoke
          xvfb-run -a npm run desktop:packaged-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}-evidence
          path: |
            .cache/desktop/smoke.json
            .cache/desktop/smoke.png
            .cache/desktop/packaged-smoke.json
          retention-days: 7

  ios-simulator-build:
    needs: native-go
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Actual Swift host policy tests
        run: node scripts/ios-build.mjs --policy-test
      - name: Host simulator runner and real Node peer contracts (not iOS execution)
        run: node --test apps/ios/Tests/SimulatorRunnerTests.mjs
      - name: Unsigned iOS simulator app and native framework build
        run: node scripts/ios-build.mjs --simulator
      - name: Execute native iOS UI and real Node peer on one installed simulator
        # Bounded compatibility probe after addmedia stalled on installed26.5.
        # Keep the full photo/XCTest gate; missing26.4.1 is a failure, not fallback.
        run: node scripts/ios-simulator.mjs --runtime=26.4.1
      - name: Clean only the simulator recorded by this gate
        if: always()
        run: node scripts/ios-simulator.mjs --cleanup-owned
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-execution-evidence
          path: .cache/ios/simulator/evidence
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-evidence
          path: |
            .cache/ios/*-report.json
            .cache/ios/logs
          retention-days: 7
